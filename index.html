<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francesco Culmone — Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Francesco Culmone, software developer — explore a Zelda-inspired interactive world built with Phaser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Francesco Culmone — Portfolio" />
    <meta
      property="og:description"
      content="Explore my portfolio as a Zelda-inspired interactive world built with Phaser."
    />
    <meta property="og:url" content="https://fculmone.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://fculmone.github.io/portfolio/og-image.jpg"
    />
    <meta name="twitter:card" content="summary" />
    <script src="/joy.min.js" defer></script>
    <script type="module" src="./src/main.js"></script>
    <style>
      body {
        margin: 0;
        background: #1a0f3e;
      }
      #joyDiv {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 120px;
        height: 120px;
        z-index: 1000;
        opacity: 0.7;
        display: block;
      }
      .skip-link {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1001;
        background: rgba(26, 15, 62, 0.85);
        color: #00ffff;
        border: 1px solid #00ffff;
        border-radius: 999px;
        padding: 8px 16px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        text-decoration: none;
      }
      .skip-link:hover {
        background: #00ffff;
        color: #1a0f3e;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #00ffff;
        font-family: "Courier New", monospace;
        font-size: 18px;
        animation: loading-pulse 1.2s ease-in-out infinite;
      }
      @keyframes loading-pulse {
        50% {
          opacity: 0.35;
        }
      }
      noscript .noscript-message {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        color: #e5e1e1;
        font-family: "Courier New", monospace;
        background: #1a0f3e;
        z-index: 2000;
      }
      noscript a {
        color: #00ffff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Loading world…</div>
    <a class="skip-link" href="/portfolio/aboutme/">About me →</a>
    <div id="joyDiv"></div>
    <noscript>
      <div class="noscript-message">
        <p>
          Hi, I'm Francesco Culmone. This portfolio is an interactive game and
          needs JavaScript.<br /><br />
          In the meantime:
          <a href="/portfolio/aboutme/">About me</a> ·
          <a href="https://github.com/fculmone">GitHub</a> ·
          <a href="https://www.linkedin.com/in/francesco-culmone/">LinkedIn</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
